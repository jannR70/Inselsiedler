name: Build Catan3D to Single EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z. B. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Titel des Release'
        required: false
        default: 'Catan3D Release'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.release_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Download HTML2EXE CLI
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # HIER die echte Asset-URL eintragen:
        Invoke-WebRequest -Uri "https://github.com/<owner>/<repo>/releases/download/<tag>/<datei>.zip" -OutFile html2exe.zip
        Expand-Archive -Path html2exe.zip -DestinationPath .\html2exe-cli

    - name: Build Single EXE
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $tool = Get-ChildItem .\html2exe-cli -Recurse -Filter HTML2EXE.exe | Select-Object -First 1
        if (-not $tool) { throw "HTML2EXE.exe nicht gefunden" }
        & $tool.FullName .\catan3d.html .\Catan3D.exe
        if ($LASTEXITCODE -ne 0) { throw "Build fehlgeschlagen" }
        if (-not (Test-Path .\Catan3D.exe)) { throw "Catan3D.exe wurde nicht erzeugt" }

    - name: Create GitHub Release
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        gh release create "$env:VERSION" .\Catan3D.exe `
          --repo "${{ github.repository }}" `
          --target "${{ github.sha }}" `
          --title "$env:RELEASE_NAME" `
          --notes "Automatischer Build von Catan3D. Version: $env:VERSION"
