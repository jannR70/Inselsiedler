name: Build Catan3D to Single EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z. B. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Titel des Release'
        required: false
        default: 'Catan3D Release'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download HTML2EXE CLI
      run: |
        curl -L -o html2exe.zip https://github.com
        Expand-Archive -Path html2exe.zip -DestinationPath ./html2exe-cli

    - name: Build Single EXE
      # Kompiliert die catan3d.html direkt in eine eigenständige Catan3D.exe
      run: |
        ./html2exe-cli/HTML2EXE.exe ./catan3d.html ./Catan3D.exe

    - name: Create GitHub Release and Upload Single EXE
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.event.inputs.version }} ./Catan3D.exe --title "${{ github.event.inputs.release_name }}" --notes "Automatischer Build von Catan3D als einzelne EXE. Version: ${{ github.event.inputs.version }}"
