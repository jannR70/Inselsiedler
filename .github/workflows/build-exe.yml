name: Build Catan3D HTML to EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z. B. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Titel des Release'
        required: false
        default: 'Catan3D Release'
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Quellcode auschecken (Nutzt v4, wird von GitHub temporär auf Node 24 angehoben)
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Node.js Umgebung bereitstellen (Explizit auf Node 24 gesetzt)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # 3. Nativefier installieren
    - name: Install Nativefier
      run: npm install -g nativefier

    # 4. HTML-Datei in EXE umwandeln
    - name: Convert HTML to EXE
      run: |
        $htmlPath = "file:///" + (Get-Item "catan3d.html").FullName.Replace('\', '/')
        nativefier --name "Catan3D" --app-version "${{ github.event.inputs.version }}" $htmlPath

    # 5. Ausgabeordner als ZIP komprimieren
    - name: Zip the Output Folder
      run: |
        Compress-Archive -Path Catan3D-win32-x64 -DestinationPath Catan3D_${{ github.event.inputs.version }}.zip

    # 6. GitHub Release erstellen und ZIP hochladen
    - name: Create GitHub Release and Upload EXE
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.event.inputs.version }} Catan3D_${{ github.event.inputs.version }}.zip --title "${{ github.event.inputs.release_name }}" --notes "Automatischer Build von Catan3D. Version: ${{ github.event.inputs.version }}"
